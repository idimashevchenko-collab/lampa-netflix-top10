name: Update Netflix Top 10

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_netflix.py"
      - ".github/workflows/update-netflix.yml"
  schedule:
    - cron: "31 12 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current Netflix Top 10 JSON
        run: python scripts/update_netflix.py

      - name: Commit only when rankings changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/top10.json

          if git diff --cached --quiet; then
            echo "No Netflix Top 10 changes."
            exit 0
          fi

          git commit -m "Update Netflix Top 10"
          git push
