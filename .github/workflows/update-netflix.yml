name: Update Streaming Tops

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_netflix.py"
      - ".github/workflows/update-netflix.yml"
  schedule:
    # FlixPatrol's same-day Netflix charts are commonly published later
    # than the general charts. 16:30 UTC is intentionally after that window.
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: streaming-tops-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch daily streaming charts
        run: python scripts/update_netflix.py

      - name: Commit rankings when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/top10.json

          if git diff --cached --quiet; then
            echo "Streaming Tops have not changed."
            exit 0
          fi

          git commit -m "Update Streaming Tops"
          git push
